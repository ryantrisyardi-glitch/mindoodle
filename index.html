async function snap(){lastSnap=Date.now();snapDirty=false;await db.collection('maps').doc(mid).collection('h').add({t:lastSnap,exp:new Date(lastSnap+WEEK),nodes:N,by:U.email})}

/* ---------- render ---------- */
const apply=()=>$('#w').setAttribute('transform',`translate(${V.x} ${V.y}) scale(${V.k})`);
function rich(t,txt,lh){txt.split('\n').forEach((ln,i)=>{const l=el('tspan',{x:0,dy:i?lh:0}),re=/\[([^\]]+)\]\((https?:[^)\s]+)\)/g;let p=0,m;while(m=re.exec(ln)){if(m.index>p)l.append(ln.slice(p,m.index));const a=el('a',{href:m[2],target:'_blank',class:'lk'});a.textContent=m[1];l.append(a);p=re.lastIndex}l.append(ln.slice(p));t.append(l)})}
function nodeEl(id,n,par){const g=el('g',{class:'nd'+(id===lastNew?' new':''),'data-id':id,transform:`translate(${n.x},${n.y})`});par.append(g);const f=n.f||14,bare=n.s==='n'||n.s==='u',c=n.c||COL[0],w0=el('g'),t=el('text',{'font-size':f,'font-weight':n.b?800:600,fill:bare?'#293247':'#fff','text-anchor':'middle'});
 rich(t,n.t||'…',f*1.3);w0.append(t);g.append(w0);const bb=t.getBBox(),ic=n.i&&IC[n.i],pw=bb.width+28+(ic?26:0),ph=bb.height+18;
 t.setAttribute('y',-(bb.y+bb.height/2));w0.setAttribute('transform',`translate(${ic?13:0},0)`);let s;
 if(n.s==='o')s=el('ellipse',{rx:pw*.62,ry:ph*.85,fill:c});else if(n.s==='u')s=el('path',{d:`M${-pw/2} ${ph/2}H${pw/2}`,stroke:c,'stroke-width':3,fill:'none','stroke-linecap':'round'});
 else s=el('rect',{x:-pw/2,y:-ph/2,width:pw,height:ph,rx:n.s==='r'?3:ph/2.4,fill:n.s==='n'?'transparent':c});g.insertBefore(s,w0);
 if(ic){const i=el('g',{transform:`translate(${-pw/2+10},-9) scale(.75)`,fill:'none',stroke:bare?c:'#fff','stroke-width':2.2,'stroke-linecap':'round','stroke-linejoin':'round'});IC[n.i].split(' M').forEach((d,j)=>i.append(el('path',{d:(j?'M':'')+d})));g.append(i)}
 if(n.cm){const d=el('circle',{cx:pw/2,cy:-ph/2,r:6,fill:'#F47C58',stroke:'#fff','stroke-width':2}),tt=el('title');tt.textContent=n.cm;d.append(tt);g.append(d)}
 if(id===sel)g.append(el('rect',{x:-pw/2-5,y:-ph/2-5,width:pw+10,height:ph+10,rx:12,fill:'none',stroke:'#293247','stroke-dasharray':'4 3'}));
 if(hit.has(id))g.append(el('rect',{x:-pw/2-6,y:-ph/2-6,width:pw+12,height:ph+12,rx:13,fill:'none',stroke:'#F47C58','stroke-width':3}));
 sizes[id]={w:pw*(n.s==='o'?1.24:1),h:ph}}
function ends(p,id){const a=N[p],b=N[id],sa=sizes[p]||{w:80},sb=sizes[id]||{w:80};return b.x>=a.x?[a.x+sa.w/2,a.y,b.x-sb.w/2,b.y]:[a.x-sa.w/2,a.y,b.x+sb.w/2,b.y]}
function render(){const g=$('#w');g.textContent='';const gE=el('g'),gN=el('g'),gH=el('g');g.append(gE,gN,gH);for(const id in N)nodeEl(id,N[id],gN);
 for(const id in N){const n=N[id];if(!n.p||!N[n.p]||n.h)continue;const [x1,y1,x2,y2]=ends(n.p,id),mx=(x1+x2)/2,my=(y1+y2)/2;let d,hx=mx,hy=my;
  if(n.o){d=`M${x1} ${y1}Q${mx+n.o[0]} ${my+n.o[1]} ${x2} ${y2}`;hx=mx+n.o[0]/2;hy=my+n.o[1]/2}else d=n.l==1?`M${x1} ${y1}L${x2} ${y2}`:`M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`;
  gE.append(el('path',{d,fill:'none',stroke:n.c||COL[0],'stroke-width':3,'stroke-linecap':'round','stroke-dasharray':n.l==2?'8 6':'none'}));
  if(id===sel&&canEdit&&!prev)gH.append(el('circle',{cx:hx,cy:hy,r:7,class:'hd','data-h':id}))}apply();lastNew=null}
function fit(){const g=$('#w'),r=$('#cv').getBoundingClientRect();if(!g.firstChild)return;const b=g.getBBox();if(!b.width)return;const k=Math.min(1.2,(r.width-60)/b.width,(r.height-60)/b.height);V.k=k;V.x=(r.width-b.width*k)/2-b.x*k;V.y=(r.height-b.height*k)/2-b.y*k;apply()}

/* ---------- interaksi canvas ---------- */
const cv=$('#cv'),wp=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-V.x)/V.k,y:(e.clientY-r.top-V.y)/V.k}};
cv.onpointerdown=e=>{if(e.target.closest('a'))return;const hd=e.target.dataset.h,nd=e.target.closest('.nd'),p=wp(e);
 if(hd&&canEdit&&!prev)drag={m:'h',id:hd};else if(nd){sel=nd.dataset.id;drag={m:'n',id:sel,x:p.x,y:p.y,ids:canEdit&&!prev?sub(sel):[]};insp();render()}else{if(sel){sel=null;insp();render()}drag={m:'p',x:e.clientX,y:e.clientY,vx:V.x,vy:V.y}}cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!drag)return;if(drag.m==='p'){V.x=drag.vx+e.clientX-drag.x;V.y=drag.vy+e.clientY-drag.y;apply();return}const p=wp(e);
 if(drag.m==='n'&&drag.ids.length){const dx=p.x-drag.x,dy=p.y-drag.y;if(!drag.moved&&Math.abs(dx)+Math.abs(dy)<2)return;drag.moved=1;drag.ids.forEach(k=>{N[k].x+=dx;N[k].y+=dy});drag.x=p.x;drag.y=p.y;render()}
 if(drag.m==='h'){const n=N[drag.id],[x1,y1,x2,y2]=ends(n.p,drag.id);n.o=[2*(p.x-(x1+x2)/2),2*(p.y-(y1+y2)/2)];drag.moved=1;render()}};
cv.onpointerup=()=>{if(drag&&drag.moved)change();drag=null};
cv.ondblclick=e=>{const h=e.target.dataset.h;if(h){delete N[h].o;change()}else if(e.target.closest('.nd'))$('#tx').focus()};
cv.onwheel=e=>{e.preventDefault();const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,k=Math.min(3,Math.max(.1,V.k*(e.deltaY<0?1.1:.9)));V.x=mx-(mx-V.x)*k/V.k;V.y=my-(my-V.y)*k/V.k;V.k=k;apply()};
document.onkeydown=e=>{if($('#ed').hidden||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||!canEdit)return;if(e.key==='Tab'){e.preventDefault();add(sel)}else if(e.key==='Enter'&&sel&&N[sel].p)add(N[sel].p);else if(e.key==='Delete')del()};
/* ---------- aksi cabang ---------- */
function add(par){if(!par||!N[par])return;const p=N[par],id=nid(),d=p.p&&N[p.p].x>p.x?-1:1,k=ch(par),y=k.length?Math.max(...k.map(j=>N[j].y))+54:p.y;
 N[id]={t:'Cabang baru',p:par,x:p.x+d*(W(par)/2+130),y,s:p.s==='rr'&&!p.p?'rr':p.s,c:p.c,i:''};lastNew=sel=id;change();insp();$('#tx').select()}
$('#add').onclick=()=>add(sel||root());
$('#del').onclick=del;function del(){if(!sel||!canEdit)return;if(!N[sel].p)return toast('Cabang utama tidak bisa dihapus');sub(sel).forEach(k=>delete N[k]);sel=null;insp();change()}
$('#cp').onclick=()=>{if(!sel||!N[sel].p)return;const L=sub(sel),m={};L.forEach(k=>m[k]=nid());L.forEach(k=>N[m[k]]={...N[k],p:k===sel?N[k].p:m[N[k].p],x:N[k].x+40,y:N[k].y+50});sel=m[sel];change();insp()};
function arrange(){const r=root();if(!r)return;const lay=(k,p,y0,d)=>{N[k].x=N[p].x+d*((W(p)+W(k))/2+60);const c=ch(k);if(!c.length){N[k].y=y0+23;return 46}let h=0;c.forEach(j=>h+=lay(j,k,y0+h,d));N[k].y=y0+h/2;return h};
 const c=ch(r);[[c.filter((k,i)=>i%2==0),1],[c.filter((k,i)=>i%2),-1]].forEach(([l,d])=>{let h=0;l.forEach(k=>h+=lay(k,r,h,d));l.forEach(k=>sub(k).forEach(j=>N[j].y+=N[r].y-h/2))});
 for(const k in N)delete N[k].o}

$('#sw').innerHTML=COL.map(c=>`<i style="background:${c}" data-c="${c}"></i>`).join('');
function insp(){const n=N[sel];$('#if').hidden=!n;$('#ib').hidden=!!n;if(!n)return;$('#tx').value=n.t||'';$('#cm').value=n.cm||'';$('#shp').value=n.s||'rr';$('#ic').value=n.i||'';$('#ls').value=n.l||0;$('#bd').checked=!!n.b}

$('#tx').oninput=()=>up('t',$('#tx').value);$('#cm').oninput=()=>up('cm',$('#cm').value);$('#shp').onchange=()=>up('s',$('#shp').value);$('#ic').onchange=()=>up('i',$('#ic').value);$('#ls').onchange=()=>up('l',+$('#ls').value);$('#bd').onchange=()=>up('b',$('#bd').checked);

/* ---------- bagikan ---------- */
$('#sh').onclick=()=>{const d=$('#dlg'),own=M.owner===U.uid,r=db.collection('maps').doc(mid);
 const draw=()=>{d.innerHTML=`<h3>Bagikan peta</h3><label><input type="checkbox" id="pb" style="width:auto" ${M.public?'checked':''} ${own?'':'disabled'}> Publik (siapa saja dengan link boleh melihat)</label><p><input readonly value="${location.href}" onclick="this.select()"></p><h4>Editor</h4>${(M.editors||[]).map(x=>`<div>${esc(x)} ${own?`<button data-r="${esc(x)}">✕</button>`:''}</div>`).join('')||'<small>Belum ada.</small>'}${own?'<p><input id="em" placeholder="email@gmail.com"><button class="b" id="ad" style="margin-top:6px">Undang sebagai editor</button></p>':''}<button onclick="dlg.close()">Tutup</button>`;
  if(own){$('#pb').onchange=async()=>{await r.update({public:$('#pb').checked});M.public=$('#pb').checked};$('#ad').onclick=async()=>{const m=$('#em').value.trim().toLowerCase();if(!/^[^@\s]+@gmail\.com$/.test(m))return toast('Hanya alamat Gmail yang bisa diundang');await r.update({editors:firebase.firestore.FieldValue.arrayUnion(m)});M.editors=[...(M.editors||[]),m];draw()};
   d.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{await r.update({editors:firebase.firestore.FieldValue.arrayRemove(b.dataset.r)});M.editors=M.editors.filter(x=>x!==b.dataset.r);draw()})}};draw();d.showModal()};

$('#hs').onclick=async()=>{await save();const d=$('#dlg');d.innerHTML='<h3>Riwayat (7 hari terakhir)</h3><div id="hl">Memuat…</div><button onclick="dlg.close()">Tutup</button>';d.showModal();

  q.forEach(s=>{const x=s.data(),b=document.createElement('button');b.className='hi';b.textContent=new Date(x.t).toLocaleString('id-ID')+' · '+x.by;b.onclick=()=>{d.close();preview(x.nodes)};$('#hl').append(b)});if(q.empty)$('#hl').textContent='Belum ada riwayat.'}catch(e){$('#hl').textContent='Gagal memuat: '+e.code}};

 const w=open('');if(!w)return toast('Izinkan pop-up untuk ekspor PDF');w.document.write(`<title>${esc(M.title)}</title><style>@page{size:landscape;margin:8mm}body{margin:0}svg{width:100%;height:auto}</style><svg xmlns="${NS}" viewBox="${b.x-p} ${b.y-p} ${b.width+2*p} ${b.height+2*p}" font-family="sans-serif">${g.outerHTML}</svg>`);w.document.close();setTimeout(()=>w.print(),500);toast('Di dialog cetak pilih "Simpan sebagai PDF"')};
