<!--
SETUP (sekali saja):
1. console.firebase.google.com → buat project → Authentication → aktifkan Google. Authorized domains: tambahkan USERNAME.github.io
2. Build → Firestore Database → buat. Tab Rules → tempel:
rules_version='2';service cloud.firestore{match /databases/{d}/documents{
 function g(){return request.auth!=null&&request.auth.token.email.matches('.*@gmail[.]com')}
 function ok(m){return g()&&(m.owner==request.auth.uid||request.auth.token.email in m.editors)}
 match /maps/{id}{
  allow read:if resource.data.public==true||resource.data.get('pubAt',0)>0||resource.data.get('pv',-1)>=0||ok(resource.data);
  allow create:if g()&&request.resource.data.owner==request.auth.uid;
  allow update:if (ok(resource.data)&&request.resource.data.owner==resource.data.owner&&(resource.data.owner==request.auth.uid||(request.resource.data.editors==resource.data.editors&&request.resource.data.public==resource.data.public&&request.resource.data.get('pubAt',0)==resource.data.get('pubAt',0)&&request.resource.data.get('pv',-1)==resource.data.get('pv',-1))))||(resource.data.get('pubAt',0)>0&&request.resource.data.diff(resource.data).affectedKeys().hasOnly(['pv'])&&request.resource.data.pv==resource.data.pv+1);
  allow delete:if request.auth!=null&&resource.data.owner==request.auth.uid;
  match /h/{x}{
   allow read:if get(/databases/$(d)/documents/maps/$(id)).data.public==true||ok(get(/databases/$(d)/documents/maps/$(id)).data);
   allow create,delete:if ok(get(/databases/$(d)/documents/maps/$(id)).data)}}}}
3. Firestore → TTL → buat policy: collection group "h", field "exp" (riwayat terhapus otomatis setelah 7 hari).
4. Project settings → Web app → salin config ke const FB di bawah. Upload file ini sebagai index.html ke repo → Settings → Pages.
-->
